# Builds and smoke-tests the Windows exe on a real Windows machine.
# NOTE: this workflow has not been run yet. Until it passes on GitHub, the exe is unverified.
name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean packaging/naeilbiseo.spec
      - name: Self-test the built exe (mock mode)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "selftest"
          New-Item -ItemType Directory -Path $data | Out-Null
          $env:NAEILBISEO_DATA_DIR = $data
          $p = Start-Process -FilePath "dist\NaeilBiseo\NaeilBiseo.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content (Join-Path $data "selftest_result.txt") -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - uses: actions/upload-artifact@v4
        with:
          name: NaeilBiseo-windows
          path: dist/NaeilBiseo
