# Builds and smoke-tests the Windows exe on a real Windows machine.
# What a green run proves: tests pass on Windows, PyInstaller builds the exe, and the exe passes its
# mock-mode self-test (nothing is sent anywhere). It does NOT prove the real AI connection works.
name: windows-build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -vv -rs
      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean packaging/naeilbiseo.spec
      - name: Self-test the built exe (mock mode)
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "selftest"
          New-Item -ItemType Directory -Path $data | Out-Null
          $env:NAEILBISEO_DATA_DIR = $data
          $p = Start-Process -FilePath "dist\NaeilBiseo\NaeilBiseo.exe" -ArgumentList "--self-test" -Wait -PassThru
          Get-Content (Join-Path $data "selftest_result.txt") -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - name: Pack the build into one zip
        shell: pwsh
        run: Compress-Archive -Path "dist\NaeilBiseo" -DestinationPath "NaeilBiseo-windows.zip"
      # The upload is allowed to fail: when the account-wide Actions artifact storage quota is full,
      # the upload is refused, and that must not hide whether tests / build / self-test passed.
      - name: Upload the exe zip (kept 3 days)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: NaeilBiseo-windows
          path: NaeilBiseo-windows.zip
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
